name: update-flake-lock
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v11
      - name: Configure SSH agent for private nfrune input
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 2222 git.solemnattic.dev >> ~/.ssh/known_hosts 2>/dev/null
          echo "${{ secrets.NFRUNE_DEPLOY_KEY }}" > ~/.ssh/nfrune_deploy_key
          chmod 600 ~/.ssh/nfrune_deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/nfrune_deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@v23
        with:
          token: ${{ secrets.FLAKE_LOCK_TOKEN }}
          pr-title: 'Update flake.lock' # Title of PR to be created
          pr-labels: | # Labels to be set on the PR
            dependencies
            automated
      - name: Enable automerge on flake update PRs
        run: gh pr merge --merge --auto "$PR_NUMBER" --repo "$OWNER/$REPO"
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
